<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 신발 쇼핑몰</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; color: #333; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; padding: 20px; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h1 { font-size: 1.8rem; color: #111; margin-bottom: 5px; }
    p.sub { color: #666; font-size: 0.9rem; }

    /* 상품 목록 그리드 */
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
    .product-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-5px); }
    .product-img { width: 100%; height: 220px; object-fit: cover; background-color: #eee; }
    .product-info { padding: 15px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
    .product-title { font-size: 1.05rem; font-weight: bold; color: #222; }
    .product-price { font-size: 1.1rem; color: #e63946; font-weight: bold; }
    
    /* 구매/문의 버튼 (당근마켓 손님용) */
    .btn-buy { display: block; text-align: center; background: #2f3438; color: #fff; padding: 10px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; margin-top: auto; font-weight: bold; }
    .btn-buy:hover { background: #000; }
  </style>
</head>
<body>

  <header>
    <h1>👟 우리동네 신발 특가샵</h1>
    <p class="sub">마음에 드는 상품을 구경하시고 채팅으로 문의주세요! (편의점 택배 가능)</p>
  </header>

  <!-- 상품들이 자동으로 뜰 공간 -->
  <div class="product-grid" id="product-list">
    <p style="text-align: center; grid-column: 1/-1; color: #888; padding: 40px;">상품을 불러오는 중입니다...</p>
  </div>

  <script>
    // 임시 샘플 상품 데이터 (나중에 구글 시트나 편한 데이터로 연동 가능합니다)
    // 구글 시트에서 상품 데이터 불러오기
    const csvUrl = https://docs.google.com/spreadsheets/d/e/2PACX-1vTu9X_4yiuuTGThA4T8m7B0SszDQx4Pgde4tuFoZENxyRb-DiBCd0IJRBKl_qbRRBr2B3Eyz58lmxsO/pubhtml;
    const productList = document.getElementById('product-list');

    async function loadProducts() {
      try {
        const response = await fetch(csvUrl);
        const data = await response.text();
        
        // CSV 데이터 분석
        const rows = data.split('\n').slice(1); // 첫 번째 줄(제목) 제외
        const products = [];

        rows.forEach(row => {
          if (!row.trim()) return;
          // 콤마로 데이터 분리
          const cols = row.split(',');
          if (cols.length >= 3) {
            products.push({
              title: cols[0].replace(/"/g, ''),
              price: cols[1].replace(/"/g, ''),
              image: cols[2].replace(/"/g, '').trim()
            });
          }
        });

        renderProducts(products);
      } catch (err) {
        console.error(err);
        productList.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: red;">상품을 불러오는 중 오류가 발생했습니다.</p>';
      }
    }

    function renderProducts(items) {
      productList.innerHTML = '';
      if (items.length === 0) {
        productList.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: #888;">등록된 상품이 없습니다.</p>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img class="product-img" src="${item.image}" alt="${item.title}">
          <div class="product-info">
            <div class="product-title">${item.title}</div>
            <div class="product-price">${Number(item.price).toLocaleString()}원</div>
            <a href="https://www.daangn.com" target="_blank" class="btn-buy">💬 당근 채팅으로 문의하기</a>
          </div>
        `;
        productList.appendChild(card);
      });
    }

    // 실행
    loadProducts();

    const productList = document.getElementById('product-list');

    function renderProducts(items) {
      productList.innerHTML = '';
      items.forEach(item => {
        // 당근마켓 채팅이나 오픈채팅으로 연결할 수 있는 링크 (원하시는 주소로 변경 가능)
        const chatUrl = "https://www.daangn.5kr"; // 혹은 본인의 당근 프로필/채팅 링크

        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <img class="product-img" src="${item.image}" alt="${item.title}">
          <div class="product-info">
            <div class="product-title">${item.title}</div>
            <div class="product-price">${Number(item.price).toLocaleString()}원</div>
            <a href="https://www.daangn.com" target="_blank" class="btn-buy">💬 당근 채팅으로 문의하기</a>
          </div>
        `;
        productList.appendChild(card);
      });
    }

    // 화면에 상품 뿌리기 실행
    renderProducts(sampleProducts);
  </script>
</body>
</html>
